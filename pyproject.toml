[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eho-seminar"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gui = ["*.qss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
